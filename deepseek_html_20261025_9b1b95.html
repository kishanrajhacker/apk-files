<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#01875F" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#4FD1A0" media="(prefers-color-scheme: dark)" />
<meta name="description" content="Free APK Store — Free Android APK downloads. No login, no ads, no premium." />
<title>Free APK Store</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<style>
/* =========================================================
   1. DESIGN TOKENS
   ========================================================= */
:root {
  color-scheme: light;
  --brand: #01875F;
  --brand-strong: #016B4C;
  --brand-soft: #E6F4EF;
  --brand-tint: #F2FAF7;
  --teal: #22B4C4;
  --bg: #F7FBF9;
  --bg-elev: #FFFFFF;
  --bg-soft: #EFF6F2;
  --text: #10231C;
  --text-soft: #4A5F57;
  --text-mute: #7A8C85;
  --border: #DDEAE4;
  --border-strong: #C4D8CF;
  --shadow-sm: 0 1px 2px rgba(16,35,28,.06), 0 1px 3px rgba(16,35,28,.05);
  --shadow-md: 0 4px 14px rgba(16,35,28,.08), 0 2px 6px rgba(16,35,28,.05);
  --shadow-lg: 0 12px 32px rgba(16,35,28,.12);
  --danger: #D92D20;
  --danger-soft: #FEE4E2;
  --star: #F5A623;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --gutter: 16px;
  --header-h: 60px;
  --tap: 44px;
  --font-head: "Bricolage Grotesque", "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.7,.3,1);
  --loader-track: #D9EFE6;
  --loader-center: #01875F;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --brand: #4FD1A0;
  --brand-strong: #3BB98A;
  --brand-soft: #11342A;
  --brand-tint: #0D241D;
  --teal: #3ECFDF;
  --bg: #0A1512;
  --bg-elev: #10201B;
  --bg-soft: #142923;
  --text: #E8F5EF;
  --text-soft: #A9C3B8;
  --text-mute: #6F8A7F;
  --border: #1E3730;
  --border-strong: #2C4D42;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 20px rgba(0,0,0,.45);
  --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
  --danger: #FF6B5E;
  --danger-soft: #3A1714;
  --loader-track: #1E3730;
  --loader-center: #4FD1A0;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --brand: #4FD1A0;
    --brand-strong: #3BB98A;
    --brand-soft: #11342A;
    --brand-tint: #0D241D;
    --teal: #3ECFDF;
    --bg: #0A1512;
    --bg-elev: #10201B;
    --bg-soft: #142923;
    --text: #E8F5EF;
    --text-soft: #A9C3B8;
    --text-mute: #6F8A7F;
    --border: #1E3730;
    --border-strong: #2C4D42;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 6px 20px rgba(0,0,0,.45);
    --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
    --danger: #FF6B5E;
    --danger-soft: #3A1714;
    --loader-track: #1E3730;
    --loader-center: #4FD1A0;
  }
}

/* =========================================================
   2. RESET / BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color .25s var(--ease), color .25s var(--ease);
}
h1,h2,h3,h4 { font-family: var(--font-head); font-weight: 700; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { max-width: 100%; display: block; }
ul { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  html { scroll-behavior: auto; }
}

/* =========================================================
   3. LAYOUT / HEADER
   ========================================================= */
.app-shell { display: flex; flex-direction: column; min-height: 100dvh; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter); }

.site-header {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.header-row {
  display: flex; align-items: center; gap: 10px;
  min-height: var(--header-h);
  padding-top: 8px; padding-bottom: 8px;
}
.brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brand-logo {
  width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand), var(--teal));
  display: grid; place-items: center; color: #fff;
  box-shadow: var(--shadow-sm);
}
.brand-logo svg { width: 18px; height: 18px; }
.brand-name { font-family: var(--font-head); font-weight: 800; font-size: 16px; white-space: nowrap; }
@media (max-width: 420px) { .brand-name { display: none; } }

.search-box { position: relative; flex: 1; min-width: 0; }
.search-box input {
  width: 100%; height: var(--tap);
  padding: 0 40px 0 38px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  font: inherit; font-size: 14px;
  transition: border-color .18s, box-shadow .18s;
}
.search-box input::placeholder { color: var(--text-mute); }
.search-box input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-mute); pointer-events: none; display: grid; place-items: center; }
.search-clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border-radius: 50%;
  display: none; place-items: center; color: var(--text-mute);
  transition: background .15s;
}
.search-clear:hover { background: var(--bg-soft); color: var(--text); }
.search-clear.show { display: grid; }

.icon-btn {
  width: var(--tap); height: var(--tap); flex-shrink: 0;
  border-radius: 50%; display: grid; place-items: center;
  color: var(--text-soft);
  transition: background .15s, color .15s, transform .1s;
}
.icon-btn:hover { background: var(--bg-soft); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 22px; height: 22px; }

.header-actions { display: flex; align-items: center; gap: 2px; }
.help-link {
  display: inline-flex; align-items: center; gap: 6px;
  height: var(--tap); padding: 0 10px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 500; color: var(--text-soft);
  transition: background .15s, color .15s;
}
.help-link:hover { background: var(--bg-soft); color: var(--text); }
@media (max-width: 720px) { .help-link span { display: none; } }

.install-btn {
  display: none; align-items: center; gap: 6px;
  height: var(--tap); padding: 0 14px; border-radius: var(--radius-xl);
  background: var(--brand); color: #fff; font-weight: 700; font-size: 13px;
  transition: filter .15s, transform .1s;
  white-space: nowrap;
}
.install-btn:hover { filter: brightness(1.06); }
.install-btn:active { transform: scale(.96); }
.install-btn.show { display: inline-flex; }

/* =========================================================
   4. GLOBAL BANNERS / TOASTS
   ========================================================= */
.offline-banner {
  display: none;
  align-items: center; gap: 10px;
  padding: 9px var(--gutter);
  background: linear-gradient(90deg, color-mix(in srgb, var(--star) 20%, var(--bg-elev)), color-mix(in srgb, var(--danger) 14%, var(--bg-elev)));
  color: var(--text);
  font-size: 13px; font-weight: 500;
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.offline-banner.show { display: flex; }
.offline-banner::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  transform: translateX(-100%);
  animation: bannerSweep 2.4s ease-in-out infinite;
}
@keyframes bannerSweep { 0% { transform: translateX(-100%);} 60%,100% { transform: translateX(100%);} }
.offline-banner svg { flex-shrink: 0; }

.toast-stack {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
  width: min(92vw, 420px);
  pointer-events: none;
}
.toast {
  background: var(--text); color: var(--bg-elev);
  padding: 12px 16px; border-radius: var(--radius-md);
  font-size: 14px; font-weight: 500; text-align: center;
  box-shadow: var(--shadow-lg);
  animation: toastIn .25s var(--ease);
  pointer-events: auto;
  word-break: break-word;
}
:root[data-theme="dark"] .toast { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border-strong); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .toast { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border-strong); }
}
@keyframes toastIn { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: translateY(0);} }

/* =========================================================
   5. MAIN CONTENT / PAGE TRANSITIONS
   ========================================================= */
main { flex: 1; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
.page { animation: pageIn .2s var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }

.section-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin: 22px 0 12px;
}
.section-title h2 { font-size: 19px; }
.section-title .muted { font-size: 12.5px; color: var(--text-mute); font-weight: 500; }

/* =========================================================
   6. TOOLBAR: CHIPS + SORT
   ========================================================= */
.toolbar { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.chip-row {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 2px 2px 6px; margin: 0 -2px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  height: 36px; padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
  color: var(--text-soft);
  font-size: 13.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { border-color: var(--brand); color: var(--text); }
.chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .chip.active { color: #062018; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip.active { color: #062018; }
}

.toolbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.result-count { font-size: 13px; color: var(--text-mute); font-weight: 500; }
.sort-wrap { position: relative; }
.sort-select {
  height: 38px; padding: 0 34px 0 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-elev); color: var(--text);
  font: inherit; font-size: 13.5px; font-weight: 500;
  appearance: none; -webkit-appearance: none;
  cursor: pointer;
}
.sort-wrap::after {
  content: ""; position: absolute; right: 12px; top: 50%;
  width: 7px; height: 7px; border-right: 2px solid var(--text-mute); border-bottom: 2px solid var(--text-mute);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}

/* =========================================================
   7. APP GRID + CARDS
   ========================================================= */
.app-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 14px;
}
@media (min-width: 520px) { .app-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 820px) { .app-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
@media (min-width: 1080px) { .app-grid { grid-template-columns: repeat(4, 1fr); } }

.app-card {
  content-visibility: auto;
  contain-intrinsic-size: 132px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px;
  box-shadow: var(--shadow-sm);
  display: flex; gap: 12px; align-items: center;
  transition: box-shadow .18s, transform .18s, border-color .18s;
  cursor: pointer;
  text-align: left; width: 100%;
}
.app-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); transform: translateY(-1px); }
.app-card:active { transform: scale(.99); }

.card-icon {
  width: 60px; height: 60px; flex-shrink: 0;
  border-radius: 15px; overflow: hidden;
  background: var(--brand-soft);
  display: grid; place-items: center;
  font-family: var(--font-head); font-weight: 800; font-size: 24px;
  color: var(--brand-strong);
  border: 1px solid var(--border);
}
.card-icon img { width: 100%; height: 100%; object-fit: cover; }

.card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card-name {
  font-family: var(--font-head); font-weight: 700; font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
.card-pub { font-size: 12.5px; color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 12px; color: var(--text-soft); flex-wrap: wrap; }
.stars { display: inline-flex; align-items: center; gap: 2px; color: var(--star); font-weight: 600; }
.stars svg { width: 12px; height: 12px; }
.dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-mute); }

.card-dl {
  flex-shrink: 0; align-self: center;
  height: 36px; padding: 0 14px;
  border-radius: 999px;
  background: var(--brand); color: #fff;
  font-size: 13px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 5px;
  transition: filter .15s, transform .1s;
  white-space: nowrap;
}
:root[data-theme="dark"] .card-dl { color: #062018; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .card-dl { color: #062018; }
}
.card-dl:hover { filter: brightness(1.06); }
.card-dl:active { transform: scale(.95); }
.card-dl[disabled] { background: var(--bg-soft); color: var(--text-mute); cursor: not-allowed; filter: none; }
.card-dl svg { width: 14px; height: 14px; }

/* =========================================================
   8. FEATURED ROW
   ========================================================= */
.featured-row {
  display: flex; gap: 12px; overflow-x: auto;
  padding: 4px 2px 10px; margin: 0 -2px;
  scroll-snap-type: x mandatory;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.featured-row::-webkit-scrollbar { display: none; }
.featured-card {
  flex: 0 0 240px; scroll-snap-align: start;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s, transform .18s;
  cursor: pointer; text-align: left;
}
.featured-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.featured-card .card-icon { width: 52px; height: 52px; font-size: 22px; border-radius: 13px; }
.featured-badge {
  align-self: flex-start;
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--star) 22%, transparent);
  color: color-mix(in srgb, var(--star) 70%, var(--text));
}

/* =========================================================
   9. SKELETON SHIMMER
   ========================================================= */
.skeleton-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px; display: flex; gap: 12px; align-items: center;
}
.sk { background: linear-gradient(90deg, var(--bg-soft) 25%, color-mix(in srgb, var(--bg-soft) 50%, var(--bg-elev)) 50%, var(--bg-soft) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk-icon { width: 60px; height: 60px; border-radius: 15px; flex-shrink: 0; }
.sk-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.sk-line { height: 12px; width: 100%; }
.sk-line.short { width: 55%; }
.sk-line.tiny { width: 35%; height: 10px; }
.sk-btn { width: 76px; height: 34px; border-radius: 999px; flex-shrink: 0; }

/* =========================================================
   10. EMPTY / ERROR / NO-INTERNET SCREENS
   ========================================================= */
.state-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 48px 20px; gap: 14px;
  min-height: 52vh;
}
.state-screen h2 { font-size: 21px; }
.state-screen p { color: var(--text-soft); font-size: 14.5px; max-width: 340px; }
.state-art { width: 168px; height: 150px; position: relative; margin-bottom: 4px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: var(--tap); padding: 0 20px;
  border-radius: 999px;
  font-size: 14.5px; font-weight: 700;
  background: var(--brand); color: #fff;
  transition: filter .15s, transform .1s, background .15s;
  min-width: 44px;
  position: relative;
}
:root[data-theme="dark"] .btn { color: #062018; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn { color: #062018; }
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.97); }
.btn.secondary { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border-strong); }
.btn.secondary:hover { background: var(--bg-soft); }
.btn[disabled] { opacity: .65; cursor: not-allowed; filter: none; }

/* Cloud art */
.cloud-art { position: absolute; inset: 0; display: grid; place-items: center; }
.cloud-float { animation: cloudFloat 2.2s ease-in-out infinite alternate; }
.cloud-float.shake { animation: cloudShake .4s ease-in-out; }
@keyframes cloudFloat { from { transform: translateY(-6px);} to { transform: translateY(6px);} }
@keyframes cloudShake {
  0%,100% { transform: translateX(0);} 20% { transform: translateX(-6px);}
  40% { transform: translateX(6px);} 60% { transform: translateX(-4px);} 80% { transform: translateX(4px);}
}
.wifi-arc { opacity: 0; animation: wifiPulse 2.4s ease-in-out infinite; }
.wifi-arc:nth-child(1) { animation-delay: 0s; }
.wifi-arc:nth-child(2) { animation-delay: .35s; }
.wifi-arc:nth-child(3) { animation-delay: .7s; }
@keyframes wifiPulse { 0%,100% { opacity: 0; } 35%,65% { opacity: .85; } }

/* =========================================================
   11. LOADER (ROUND SPINNER)
   ========================================================= */
.loader-wrap { display: inline-flex; flex-direction: column; align-items: center; gap: 14px; }
.loader-svg { display: block; }
.loader-svg .ring-outer {
  transform-origin: center;
  animation: spinCW 1.1s linear infinite;
}
.loader-svg .ring-dashed {
  transform-origin: center;
  animation: spinCCW 1.8s linear infinite;
}
.loader-svg .orbit-dot { transform-origin: center; animation: orbit 2.4s linear infinite; }
.loader-svg .orbit-dot:nth-child(2) { animation-delay: -0.8s; }
.loader-svg .orbit-dot:nth-child(3) { animation-delay: -1.6s; }
.loader-svg .dot-pulse { transform-origin: center; animation: dotBreath 1.5s ease-in-out infinite; }
.loader-svg .orbit-dot:nth-child(2) .dot-pulse { animation-delay: .3s; }
.loader-svg .orbit-dot:nth-child(3) .dot-pulse { animation-delay: .6s; }
.loader-svg .center-arrow { transform-origin: center; animation: arrowPulse .9s ease-in-out infinite alternate; }
@keyframes spinCW { to { transform: rotate(360deg); } }
@keyframes spinCCW { to { transform: rotate(-360deg); } }
@keyframes orbit { to { transform: rotate(360deg); } }

function safeText(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }

function escapeHTML(s) {
  return safeText(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const k in props) {
    if (k === "class") node.className = props[k];
    else if (k === "text") node.textContent = props[k];
    else if (k === "html") node.innerHTML = props[k];
    else if (k === "attrs") { for (const a in props[k]) node.setAttribute(a, props[k][a]); }
    else if (k === "dataset") { for (const d in props[k]) node.dataset[d] = props[k][d]; }
    else if (k.startsWith("on") && typeof props[k] === "function") node.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else node[k] = props[k];
  }
  for (const c of children) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

function applyTheme(theme) {
  try {
    if (theme === "dark" || theme === "light") {
      document.documentElement.setAttribute("data-theme", theme);
    } else {
      document.documentElement.removeAttribute("data-theme");

}
function currentTheme() {
  try {
    const attr = document.documentElement.getAttribute("data-theme");
    if (attr) return attr;

}
function initTheme() {

}

/* ============================================================
   LOADER SVG
   ============================================================ */
function createLoader(size = 72) {
  const wrap = el("div", { class: "loader-wrap" });
  const r = size / 2;
  const cx = r, cy = r;
  const outerR = r - 6;
  const innerR = outerR - 8;
  const dotOrbitR = (outerR + innerR) / 2;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
  svg.setAttribute("class", "loader-svg");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");

  // Outer 270° arc
  const arcLen = 2 * Math.PI * outerR * 0.75;
  const outerArc = document.createElementNS(svgNS, "circle");
  outerArc.setAttribute("cx", cx);
  outerArc.setAttribute("cy", cy);
  outerArc.setAttribute("r", outerR);
  outerArc.setAttribute("fill", "none");
  outerArc.setAttribute("stroke", "url(#loaderGrad)");
  outerArc.setAttribute("stroke-width", 5);
  outerArc.setAttribute("stroke-linecap", "round");
  outerArc.setAttribute("stroke-dasharray", `${arcLen} ${2 * Math.PI * outerR}`);
  outerArc.setAttribute("class", "ring-outer");
  svg.appendChild(outerArc);

  // Inner dashed circle
  const innerCircle = document.createElementNS(svgNS, "circle");
  innerCircle.setAttribute("cx", cx);
  innerCircle.setAttribute("cy", cy);
  innerCircle.setAttribute("r", innerR);
  innerCircle.setAttribute("fill", "none");
  innerCircle.setAttribute("stroke", "var(--loader-track)");
  innerCircle.setAttribute("stroke-width", 2);
  innerCircle.setAttribute("stroke-dasharray", "4 6");
  innerCircle.setAttribute("class", "ring-dashed");
  svg.appendChild(innerCircle);

  // Center arrow
  const arrowGroup = document.createElementNS(svgNS, "g");
  arrowGroup.setAttribute("class", "center-arrow");
  arrowGroup.setAttribute("transform", `translate(${cx}, ${cy})`);
  const arrow = document.createElementNS(svgNS, "path");
  arrow.setAttribute("d", "M0,-7 L0,5 M-6,0 L0,6 L6,0");
  arrow.setAttribute("fill", "none");
  arrow.setAttribute("stroke", "var(--loader-center)");
  arrow.setAttribute("stroke-width", 2.2);
  arrow.setAttribute("stroke-linecap", "round");
  arrow.setAttribute("stroke-linejoin", "round");
  arrowGroup.appendChild(arrow);
  svg.appendChild(arrowGroup);

  // 3 orbiting dots
  for (let i = 0; i < 3; i++) {
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", "orbit-dot");
    g.setAttribute("transform", `rotate(${i * 120}, ${cx}, ${cy})`);
    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("cx", cx);
    dot.setAttribute("cy", cy - dotOrbitR);
    dot.setAttribute("r", 2.6);
    dot.setAttribute("fill", "var(--brand)");
    dot.setAttribute("class", "dot-pulse");
    g.appendChild(dot);
    svg.appendChild(g);
  }

  wrap.appendChild(svg);
  return wrap;
}

/* ============================================================
   NORMALIZE APP (tolerant, never throws)
   ============================================================ */
function capFirst(s) {
  s = safeText(s).trim();
  if (!s) return "Other";
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function isHttps(s) {
  try { return typeof s === "string" && /^https:\/\//i.test(s.trim()); } catch (_) { return false; }
}
function toArray(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  if (typeof v === "object") return Object.values(v);
  return [];
}

function normalizeApp(id, data) {
  try {
    if (!data || typeof data !== "object") return null;
    const d = data;

    const name = safeText(d.name || d.appName || d.title || "Unnamed app").trim() || "Unnamed app";
    const publisher = safeText(d.publisher || d.developer || "").trim();
    const category = capFirst(d.category || d.cat || "Other");
    const version = safeText(d.version || d.app_version || "").trim();
    const size = safeText(d.size || d.appSize || "").trim();
    const rawIcon = safeText(d.icon || d.iconUrl || "").trim();
    const icon = isHttps(rawIcon) ? rawIcon : "";
    const rawApk = safeText(d.apkUrl || d.downloadUrl || d.url || "").trim();
    const apkUrl = isHttps(rawApk) ? rawApk : "";
    const description = safeText(d.description || "").trim();
    const fullDescription = safeText(d.fullDescription || d.description || "").trim();
    const whatsNew = safeText(d.whatsNew || "").trim();
    const packageName = safeText(d.packageName || "").trim();

    const rawShots = toArray(d.screenshots);
    const screenshots = rawShots.map(s => safeText(s).trim()).filter(isHttps);

    let rating = Number(d.rating);
    if (!isFinite(rating) || rating < 0) rating = 0;
    if (rating > 5) rating = 5;

    const downloads = safeText(d.downloads || "").trim();

    // published: false ONLY if the field exists and is exactly false
    let published = true;
    if (Object.prototype.hasOwnProperty.call(d, "published") && d.published === false) published = false;

    const featured = d.featured === true;

    let createdAt = Number(d.createdAt);
    if (!isFinite(createdAt)) createdAt = 0;

    let sizeBytes = Number(d.sizeBytes);
    if (!isFinite(sizeBytes)) sizeBytes = 0;

    return {
      id: safeText(id),
      name, publisher, category, version, size, icon, apkUrl,
      description, fullDescription, whatsNew, packageName,
      screenshots, rating, downloads, published, featured,
      createdAt, sizeBytes
    };
  } catch (err) {
    console.warn("normalizeApp failed for", id, err);
    return null;
  }
}

/* ============================================================
   DOWNLOADS PARSER ("10K+", "1M+", "1,234")
   ============================================================ */
function parseDownloads(s) {
  try {
    if (!s) return 0;
    const str = String(s).trim().toUpperCase().replace(/,/g, "");
    const m = str.match(/([\d.]+)\s*([KMB])?/);
    if (!m) return 0;
    let n = parseFloat(m[1]);
    if (!isFinite(n)) return 0;
    if (m[2] === "K") n *= 1000;
    else if (m[2] === "M") n *= 1000000;
    else if (m[2] === "B") n *= 1000000000;
    return n;
  } catch (_) { return 0; }
}

/* ============================================================
   CACHE (localStorage)
   ============================================================ */
const CACHE_KEY = "fas_apps_cache_v1";
function saveCache(list) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); } catch (_) {}
}
function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.map(a => a && typeof a === "object" ? a : null).filter(Boolean);
  } catch (_) { return []; }
}

function renderSkeleton() {

/* ============================================================
   STARS
   ============================================================ */
function starEl(rating) {
  const wrap = el("span", { class: "stars", attrs: { "aria-label": `Rating ${rating} out of 5` } });
  const full = Math.round(rating);
  for (let i = 0; i < 1; i++) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", full > 0 ? "currentColor" : "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.6");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.3 6.2 20.4l1.1-6.4L2.6 9.4l6.5-.9z");
    svg.appendChild(p);
    wrap.appendChild(svg);
  }
  wrap.appendChild(document.createTextNode(rating.toFixed(1)));
  return wrap;
}

/* ============================================================
   LETTER AVATAR FALLBACK
   ============================================================ */
function letterFor(name) {
  const s = safeText(name).trim();
  return s ? s.charAt(0).toUpperCase() : "?";
}

function iconNode(app, sizeClass) {
  const wrap = el("div", { class: sizeClass || "card-icon" });
  if (app.icon) {
    const img = el("img", {
      attrs: {
        src: app.icon,
        alt: `${app.name} icon`,
        loading: "lazy",
        decoding: "async"
      }
    });
    img.addEventListener("error", () => {
      try { img.remove(); } catch (_) {}
      wrap.textContent = letterFor(app.name);
    });
    wrap.appendChild(img);
  } else {
    wrap.textContent = letterFor(app.name);
  }
  return wrap;
}

/* ============================================================
   FILTER + SORT
   ============================================================ */
function getCategories(apps) {
  const set = new Set();
  apps.forEach(a => { if (a.published) set.add(a.category || "Other"); });
  return ["All", ...Array.from(set).sort((a, b) => a.localeCompare(b))];
}

function filteredApps() {
  let list = state.apps.filter(a => a.published);

  if (state.category && state.category !== "All") {
    list = list.filter(a => a.category === state.category);
  }

  const q = state.search.trim().toLowerCase();
  if (q) {
    list = list.filter(a =>
      a.name.toLowerCase().includes(q) ||
      a.publisher.toLowerCase().includes(q) ||
      a.category.toLowerCase().includes(q)
    );
  }

  const sorted = list.slice();
  switch (state.sort) {
    case "downloads":
      sorted.sort((a, b) => parseDownloads(b.downloads) - parseDownloads(a.downloads));
      break;
    case "rating":
      sorted.sort((a, b) => b.rating - a.rating);
      break;
    case "az":
      sorted.sort((a, b) => a.name.localeCompare(b.name));
      break;
    case "newest":
    default:
      sorted.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      break;
  }
  return sorted;
}

   ============================================================ */
function appCard(app) {
  const card = el("article", { class: "app-card", attrs: { role: "button", tabindex: "0", "aria-label": `${app.name} details` } });

  card.appendChild(iconNode(app, "card-icon"));

  const body = el("div", { class: "card-body" });
  body.appendChild(el("div", { class: "card-name", text: app.name }));
  if (app.publisher) body.appendChild(el("div", { class: "card-pub", text: app.publisher }));

  const meta = el("div", { class: "card-meta" });
  if (app.rating > 0) meta.appendChild(starEl(app.rating));
  if (app.size) {
    if (meta.childNodes.length) meta.appendChild(el("span", { class: "dot-sep" }));
    meta.appendChild(el("span", { text: app.size }));
  }
  body.appendChild(meta);

  card.appendChild(body);

  // Download button (card)
  const dlBtn = el("button", { class: "card-dl", attrs: { type: "button", "aria-label": `${app.name} download` } });
  const dlSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  dlSvg.setAttribute("viewBox", "0 0 24 24");
  dlSvg.setAttribute("fill", "none");
  dlSvg.setAttribute("stroke", "currentColor");
  dlSvg.setAttribute("stroke-width", "2.4");
  dlSvg.setAttribute("stroke-linecap", "round");
  dlSvg.setAttribute("stroke-linejoin", "round");
  const dlPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
  dlPath.setAttribute("d", "M12 3v12 M6 11l6 6 6-6 M5 21h14");
  dlSvg.appendChild(dlPath);
  dlBtn.appendChild(dlSvg);
  dlBtn.appendChild(document.createTextNode("Download"));

  if (!app.apkUrl || state.offline) {
    dlBtn.disabled = true;
  }

  dlBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (state.offline) { toast("Internet nahi hai"); return; }
    if (!app.apkUrl) { toast("Link nahi hai"); return; }
    triggerDownload(app);
  });

  card.appendChild(dlBtn);

  const goDetail = () => { navigate(`#/app/${encodeURIComponent(app.id)}`); };
  card.addEventListener("click", goDetail);
  card.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goDetail(); }
  });

  return card;
}

/* ============================================================
   DOWNLOAD HANDLER
   ============================================================ */
function triggerDownload(app) {
  try {
    if (state.offline) { toast("Internet nahi hai"); return; }
    if (!app.apkUrl) { toast("Link nahi hai"); return; }

    const a = document.createElement("a");
    a.href = app.apkUrl;
    a.download = "";
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try { a.remove(); } catch (_) {} }, 1000);

    toast("Download shuru ho raha hai");
  } catch (err) {
    console.warn("Download failed:", err);
    toast("Download shuru nahi ho paya");
  }
}

    ["downloads", "Most downloaded"],
    ["rating", "Top rated"],
    ["az", "A-Z"]
  ];
  sorts.forEach(([val, label]) => {
    const opt = el("option", { text: label, attrs: { value: val } });

    empty.appendChild(el("h2", { text: state.apps.length === 0 ? "Abhi koi app nahi" : "Koi app nahi mili" }));

        state.category = "All";
        searchInput.value = "";
        searchClear.classList.remove("show");
        renderHome();

      empty.appendChild(btn);
    }
    frag.appendChild(empty);
  } else {
    const grid = el("div", { class: "app-grid", attrs: { "aria-label": "Apps list" } });
    filtered.forEach(a => grid.appendChild(appCard(a)));
    frag.appendChild(grid);
  }

  appEl.appendChild(el("div", { class: "page" }, [frag]));
}

async function shareApp(app) {
  try {
    const url = `${location.origin}${location.pathname}#/app/${encodeURIComponent(app.id)}`;
    if (navigator.share) {
      await navigator.share({ title: app.name, text: `${app.name} — Free APK Store se download karein`, url });
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(url);
      toast("Link copy ho gaya");
    } else {
      toast("Share support nahi hai");
    }
  } catch (err) {
    if (err && err.name === "AbortError") return;
    try {
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(`${location.origin}${location.pathname}#/app/${encodeURIComponent(app.id)}`);
        toast("Link copy ho gaya");
      } else toast("Share nahi ho paya");
    } catch (_) { toast("Share nahi ho paya"); }
  }
}

  }));

}

function arrowSvg() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "arrow");
  svg.setAttribute("width", "20"); svg.setAttribute("height", "20");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "2.2");
  svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", "M9 18l6-6-6-6");
  svg.appendChild(p);
  return svg;
}

/* ============================================================
   NO INTERNET / SERVER ERROR SCREEN
   ============================================================ */
function cloudArt(opts = {}) {
  const { error = false, animated = true } = opts;
  const wrap = el("div", { class: "state-art" });
  const art = el("div", { class: "cloud-art" + (animated ? "" : ""), attrs: { "aria-hidden": "true" } });

  const floatWrap = el("div", { class: "cloud-float" });

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 200 170");
  svg.setAttribute("width", "180");
  svg.setAttribute("height", "160");
  svg.setAttribute("fill", "none");

  // Wi-Fi arcs (top)
  for (let i = 0; i < 3; i++) {
    const arc = document.createElementNS(svgNS, "path");
    if (i === 0) arc.setAttribute("d", "M86 18 A 16 16 0 0 1 114 18");
    if (i === 1) arc.setAttribute("d", "M78 30 A 26 26 0 0 1 122 30");
    if (i === 2) arc.setAttribute("d", "M70 42 A 36 36 0 0 1 130 42");
    arc.setAttribute("stroke", "var(--brand)");
    arc.setAttribute("stroke-width", "4");
    arc.setAttribute("stroke-linecap", "round");
    arc.setAttribute("class", "wifi-arc");
    svg.appendChild(arc);
  }

  // Cloud body (soft tonal)
  const cloudColor = error ? "color-mix(in srgb, var(--danger) 18%, var(--bg-elev))" : "color-mix(in srgb, var(--brand) 16%, var(--bg-elev))";
  const cloudStroke = error ? "var(--danger)" : "var(--brand-strong)";

  // Rounded rect base
  const base = document.createElementNS(svgNS, "rect");
  base.setAttribute("x", "44");
  base.setAttribute("y", "84");
  base.setAttribute("width", "112");
  base.setAttribute("height", "46");
  base.setAttribute("rx", "23");
  base.setAttribute("fill", cloudColor);
  base.setAttribute("stroke", cloudStroke);
  base.setAttribute("stroke-width", "3");
  svg.appendChild(base);

  // Cloud circles
  const circles = [
    { cx: 74, cy: 88, r: 24 },
    { cx: 104, cy: 80, r: 30 },
    { cx: 132, cy: 90, r: 22 }
  ];
  circles.forEach(c => {
    const circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", String(c.cx));
    circle.setAttribute("cy", String(c.cy));
    circle.setAttribute("r", String(c.r));
    circle.setAttribute("fill", cloudColor);
    circle.setAttribute("stroke", cloudStroke);
    circle.setAttribute("stroke-width", "3");
    svg.appendChild(circle);
  });

  // Slash or exclamation mark
  if (error) {
    const ex = document.createElementNS(svgNS, "g");
    const line1 = document.createElementNS(svgNS, "line");
    line1.setAttribute("x1", "100"); line1.setAttribute("y1", "96");
    line1.setAttribute("x2", "100"); line1.setAttribute("y2", "114");
    line1.setAttribute("stroke", "var(--danger)");
    line1.setAttribute("stroke-width", "5");
    line1.setAttribute("stroke-linecap", "round");
    ex.appendChild(line1);
    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("cx", "100"); dot.setAttribute("cy", "121");
    dot.setAttribute("r", "2.8");
    dot.setAttribute("fill", "var(--danger)");
    ex.appendChild(dot);
    svg.appendChild(ex);
  } else {
    const slash = document.createElementNS(svgNS, "line");
    slash.setAttribute("x1", "58"); slash.setAttribute("y1", "64");
    slash.setAttribute("x2", "150"); slash.setAttribute("y2", "138");
    slash.setAttribute("stroke", "var(--danger)");
    slash.setAttribute("stroke-width", "5");
    slash.setAttribute("stroke-linecap", "round");
    svg.appendChild(slash);
  }

  floatWrap.appendChild(svg);
  art.appendChild(floatWrap);
  wrap.appendChild(art);
  return wrap;
}

function showNoInternet() {
  const frag = document.createDocumentFragment();
  const screen = el("div", { class: "state-screen" });

  const cloudWrap = cloudArt({ error: false });
  screen.appendChild(cloudWrap);

  screen.appendChild(el("h2", { text: "Internet nahi hai" }));
  screen.appendChild(el("p", { text: "Apna WiFi ya mobile data check karein, phir dobara try karein." }));

  const btn = el("button", { class: "btn", text: "Dobara try karein", attrs: { type: "button" } });
  btn.addEventListener("click", () => {
    retryAction(btn, cloudWrap.querySelector(".cloud-float"));
  });

  screen.appendChild(btn);
  frag.appendChild(screen);
  appEl.replaceChildren();
  appEl.appendChild(el("div", { class: "page" }, [frag]));
}

function showServerError(reason) {
  const frag = document.createDocumentFragment();
  const screen = el("div", { class: "state-screen" });

  screen.appendChild(cloudArt({ error: true }));
  screen.appendChild(el("h2", { text: "Kuch gadbad ho gayi" }));
  screen.appendChild(el("p", { text: reason || "Server se data nahi aa paya. Thodi der baad try karein." }));

  const btn = el("button", { class: "btn", text: "Dobara try karein", attrs: { type: "button" } });
  btn.addEventListener("click", () => {
    retryAction(btn, null);
  });
  screen.appendChild(btn);

  frag.appendChild(screen);
  appEl.replaceChildren();
  appEl.appendChild(el("div", { class: "page" }, [frag]));
}

function retryAction(btn, cloudEl) {
  try {
    const origText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "";
    const loader = createLoader(22);
    loader.querySelector(".loader-text")?.remove();
    btn.appendChild(loader);

    setTimeout(() => {
      try {
        btn.disabled = false;
        btn.textContent = origText;

        if (!navigator.onLine) {
          if (cloudEl) {
            cloudEl.classList.add("shake");
            setTimeout(() => { try { cloudEl.classList.remove("shake"); } catch (_) {} }, 450);
          }
          toast("Abhi bhi internet nahi hai");
        } else {
          retryLoad();
        }
      } catch (_) {}
    }, 600);
  } catch (_) {}
}

/* ============================================================
   ROUTING
   ============================================================ */
function parseRoute() {
  const hash = location.hash || "#/";
  if (hash.startsWith("#/app/")) {
    const id = decodeURIComponent(hash.slice(6));
    return { name: "detail", id };
  }
  if (hash.startsWith("#/help")) return { name: "help", id: null };
  return { name: "home", id: null };
}

function navigate(hash) {
  if (location.hash === hash) {
    renderRoute();
  } else {
    location.hash = hash;
  }
}

function renderRoute() {
  const route = parseRoute();
  state.route = route;

  try { window.scrollTo({ top: 0, behavior: "auto" }); } catch (_) {}

  if (route.name === "help") {
    renderHelp();
    return;
  }

  if (route.name === "detail") {
    renderDetail(route.id);
    return;
  }

  // Home: handle offline / loading / error
  if (state.offline && state.apps.length === 0) {
    showNoInternet();
    return;
  }
  if (state.error && state.apps.length === 0) {
    showServerError(state.error);
    return;
  }
  renderHome();
}

/* ============================================================
   LOADING / FIREBASE SUBSCRIPTION
   ============================================================ */
let retryTimer = null;
function retryLoad() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  state.loading = true;
  state.error = null;
  if (state.route.name === "home") renderRoute();
  subscribeApps();
}

async function subscribeApps() {
  // Unsubscribe previous
  if (unsubscribeApps) {
    try { unsubscribeApps(); } catch (_) {}
    unsubscribeApps = null;
  }

  const fb = await initFirebase();
  if (!fb) {
    state.loading = false;
    state.error = "Firebase load nahi ho paya. Internet check karein.";
    if (state.apps.length === 0) {
      const cached = loadCache();
      if (cached.length > 0) {
        state.apps = cached;
        state.usingCache = true;
      } else {
        state.offline = true;
      }
    }
    if (state.route.name === "home") renderRoute();
    return;
  }

  const { ref, onValue } = fb;
  try {
    const dbRef = ref(firebaseDb, APPS_PATH);
    unsubscribeApps = onValue(
      dbRef,
      (snapshot) => {
        try {
          const val = snapshot.val();
          let list = [];
          if (val && typeof val === "object") {
            list = Object.entries(val).map(([id, data]) => normalizeApp(id, data)).filter(Boolean);
          }
          state.apps = list;
          state.loading = false;
          state.error = null;
          state.offline = false;
          state.usingCache = false;
          hideOfflineBanner();
          hideGlobalLoader();
          saveCache(list);
          if (state.route.name === "home" || state.route.name === "detail") renderRoute();
        } catch (err) {
          console.warn("onValue handler failed:", err);
          handleDbError(err);
        }
      },
      (error) => {
        console.warn("DB error:", error);
        handleDbError(error);
      }
    );
  } catch (err) {
    console.warn("subscribeApps failed:", err);
    handleDbError(err);
  }
}

function handleDbError(error) {
  state.loading = false;

  // Try cache
  const cached = loadCache();
  if (cached.length > 0) {
    state.apps = cached;
    state.usingCache = true;
    state.offline = !navigator.onLine;
    if (state.offline) showOfflineBanner();
  } else {
    state.apps = [];
  }

  let reason = "Server se data nahi aa paya.";
  const code = error && (error.code || "");
  const msg = error && (error.message || "");
  if (String(code).includes("permission-denied") || /permission/i.test(msg)) {
    reason = "Database rules me apps ka read allow karein.";
  } else if (/network/i.test(msg) || !navigator.onLine) {
    state.offline = true;
    reason = "Internet nahi hai.";
  }

  if (state.apps.length === 0 && !state.offline) {
    state.error = reason;
  }

  hideGlobalLoader();

  if (state.offline && state.apps.length === 0) {
    showNoInternet();
  } else if (state.error) {
    showServerError(state.error);
  } else {
    if (state.offline) showOfflineBanner();
    if (state.route.name === "home") renderRoute();
  }
}

/* ============================================================
   OFFLINE BANNER / GLOBAL LOADER
   ============================================================ */
function showOfflineBanner() { try { offlineBanner.classList.add("show"); } catch (_) {} }
function hideOfflineBanner() { try { offlineBanner.classList.remove("show"); } catch (_) {} }
function hideGlobalLoader() {
  try {
    globalLoader.classList.add("hide");
    setTimeout(() => { try { globalLoader.style.display = "none"; } catch (_) {} }, 400);
  } catch (_) {}
}

/* ============================================================
   ONLINE / OFFLINE TRACKING
   ============================================================ */
let wasOffline = !navigator.onLine;

function handleOffline() {
  state.offline = true;
  wasOffline = true;
  const cached = loadCache();
  if (cached.length > 0 && state.apps.length === 0) {
    state.apps = cached;
    state.usingCache = true;
  }
  if (state.apps.length > 0) showOfflineBanner();
  else if (state.route.name === "home") showNoInternet();
  if (state.route.name === "detail") renderRoute();
}

function handleOnline() {
  if (wasOffline) {
    toast("Internet wapas aa gaya");
    wasOffline = false;
  }
  state.offline = false;
  hideOfflineBanner();
  retryLoad();
}

/* ============================================================
   SEARCH
   ============================================================ */
let searchDebounce = null;
function onSearchInput() {
  const val = searchInput.value;
  searchClear.classList.toggle("show", val.length > 0);
  if (searchDebounce) clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    state.search = val;
    // Only re-render if on home; keep focus
    if (state.route.name === "home") {
      const hadFocus = document.activeElement === searchInput;
      const selStart = searchInput.selectionStart;
      const selEnd = searchInput.selectionEnd;
      renderHome();
      if (hadFocus) {
        try {
          searchInput.focus();
          searchInput.setSelectionRange(selStart, selEnd);
        } catch (_) {}
      }
    }
  }, 200);
}

/* ============================================================
   PWA / SERVICE WORKER / INSTALL
   ============================================================ */
let deferredInstallPrompt = null;

function initInstallPrompt() {
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = $("#installBtn");
    if (btn) {
      btn.classList.add("show");
      btn.addEventListener("click", async () => {
        try {
          if (!deferredInstallPrompt) { toast("Install abhi available nahi hai"); return; }
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          $("#installBtn").classList.remove("show");
        } catch (_) { toast("Install nahi ho paya"); }
      }, { once: true });
    }
  });
}

function registerSW() {
  try {
    if (!("serviceWorker" in navigator)) return;
    const isSecure = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if (!isSecure) return;

    const swCode = `
const CACHE = "free-apk-store-v1";
const SHELL = ["./", "./index.html"];
self.addEventListener("install", (e) => {
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL).catch(() => {})));
});
self.addEventListener("activate", (e) => {
  e.waitUntil(
    caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
      .then(() => self.clients.claim())
  );
});
self.addEventListener("fetch", (e) => {
  const req = e.request;
  if (req.method !== "GET") return;
  const url = new URL(req.url);
  // Static shell -> cache first
  const isShell = url.pathname.endsWith("/") || url.pathname.endsWith("/index.html");
  if (isShell) {
    e.respondWith(
      caches.match(req).then(cached => cached || fetch(req).then(res => {
        const copy = res.clone();
        caches.open(CACHE).then(c => c.put(req, copy).catch(() => {}));
        return res;
      }).catch(() => caches.match("./index.html")))
    );
    return;
  }
  // Everything else -> network first, fallback cache
  e.respondWith(
    fetch(req).then(res => {
      const copy = res.clone();
      caches.open(CACHE).then(c => c.put(req, copy).catch(() => {}));
      return res;
    }).catch(() => caches.match(req))
  );
});
`;
    const blob = new Blob([swCode], { type: "application/javascript" });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  } catch (_) {}
}

function initManifest() {
  try {
    const manifest = {
      name: "Free APK Store",
      short_name: "APK Store",
      start_url: ".",
      display: "standalone",
      background_color: "#F7FBF9",
      theme_color: "#01875F",
      icons: [
        {
          src: "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#01875F"/><path d="M256 112v200" stroke="#fff" stroke-width="40" stroke-linecap="round"/><path d="M156 268l100 100 100-100" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M136 392h240" stroke="#fff" stroke-width="40" stroke-linecap="round"/></svg>'
          ),
          sizes: "512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch (_) {}
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  try {
    $("#year").textContent = String(new Date().getFullYear());
  } catch (_) {}

  initTheme();
  initManifest();
  registerSW();
  initInstallPrompt();

  // Global loader SVG
  try {
    const l = createLoader(76);
    const txt = l.querySelector(".loader-text");
    if (txt) txt.remove();
    globalLoaderSvg.replaceChildren(l);
  } catch (_) {}

  // Search
  searchInput.addEventListener("input", onSearchInput);
  searchInput.addEventListener("search", onSearchInput);
  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    searchClear.classList.remove("show");
    state.search = "";
    if (state.route.name === "home") renderHome();
    try { searchInput.focus(); } catch (_) {}
  });

  // Online/offline
  window.addEventListener("online", handleOnline);
  window.addEventListener("offline", handleOffline);
  if (!navigator.onLine) {
    state.offline = true;
    wasOffline = true;
  }

  // Routing
  window.addEventListener("hashchange", () => {
    renderRoute();
  });

  // Escape closes dialogs (none currently but future-proof)
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (document.activeElement === searchInput && searchInput.value) {
        searchInput.value = "";
        searchClear.classList.remove("show");
        state.search = "";
        if (state.route.name === "home") renderHome();
      }
    }
  });

  // Initial route
  if (!location.hash) {
    try { history.replaceState(null, "", "#/"); } catch (_) {}
  }

  // Initial offline path
  if (state.offline) {
    const cached = loadCache();
    if (cached.length > 0) {
      state.apps = cached;
      state.usingCache = true;
      showOfflineBanner();
      hideGlobalLoader();
      renderRoute();
    } else {
      hideGlobalLoader();
      showNoInternet();
    }
  } else {
    renderRoute();
    subscribeApps();
  }

  // Safety: hide global loader after 6s no matter what
  setTimeout(() => { hideGlobalLoader(); }, 6000);
}

document.addEventListener("DOMContentLoaded", init);
</script>
